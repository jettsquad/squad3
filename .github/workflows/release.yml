name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            script: dist:win
          - platform: mac-arm64
            runner: macos-15
            script: dist:mac
          - platform: mac-x64
            runner: macos-15-intel
            script: dist:mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exitCode = 1"
      - name: Verify default cloud endpoint configuration
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SQUAD_DEVICE_GATEWAY: ${{ vars.SQUAD_DEVICE_GATEWAY }}
        run: node -e "if (!/^[A-Za-z0-9][A-Za-z0-9.-]*:[0-9]{1,5}:[0-9a-f]{64}$/.test(process.env.SQUAD_DEVICE_GATEWAY || '')) throw Error('Set the SQUAD_DEVICE_GATEWAY repository variable before releasing')"
      - name: Build installer
        env:
          SQUAD_DEVICE_GATEWAY: ${{ vars.SQUAD_DEVICE_GATEWAY }}
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Verify default cloud endpoint is bundled
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SQUAD_DEVICE_GATEWAY: ${{ vars.SQUAD_DEVICE_GATEWAY }}
        run: node -e "if (!require('fs').readFileSync('out/main/index.js', 'utf8').includes(process.env.SQUAD_DEVICE_GATEWAY)) throw Error('Default cloud endpoint was not bundled')"
      - name: Prepare prerelease update metadata
        if: runner.os == 'Windows' && contains(github.ref_name, '-')
        shell: pwsh
        run: Copy-Item release/latest.yml release/dev.yml
      - name: Verify disk image
        if: runner.os == 'macOS'
        run: hdiutil verify release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: squad-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/dev.yml
            release/*.dmg

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: squad-*
          path: release
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          note='Windows x64 支持应用内更新。macOS 请按芯片选择 Apple 芯片（arm64）或 Intel（x64）的 DMG 手动更新。'
          if [[ "$GITHUB_REF_NAME" == "v3.0.0-dev.8" ]]; then
            note=$'首次启动自动开通云端 MiniMax 的 10 天试用。可申请 1 个月或 1 年使用授权，由后台审核。\n\n'"$note"
          elif [[ "$GITHUB_REF_NAME" == "v3.0.0-dev.9" ]]; then
            note=$'修复 macOS 的「检查更新」。新版能检测较新的兼容版本并提供对应 DMG 的下载按钮。从旧版升级到此版需先手动安装。\n\n'"$note"
          elif [[ "$GITHUB_REF_NAME" == "v3.0.0-dev.10" ]]; then
            note=$'连接库只配置推理来源。Agent 库可独立选择推理连接和本机 Harness，现有配置会保留。Octopus 目前仍通过本机 Codex Harness 执行工具。\n\n'"$note"
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --notes "$note" "${flags[@]}"
