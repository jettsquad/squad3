name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            script: dist:win
          - platform: mac-arm64
            runner: macos-15
            script: dist:mac
          - platform: mac-x64
            runner: macos-15-intel
            script: dist:mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exitCode = 1"
      - run: npm run ${{ matrix.script }} -- --publish never
      - name: Prepare prerelease update metadata
        if: runner.os == 'Windows' && contains(github.ref_name, '-')
        shell: pwsh
        run: Copy-Item release/latest.yml release/dev.yml
      - name: Verify disk image
        if: runner.os == 'macOS'
        run: hdiutil verify release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: squad-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/dev.yml
            release/*.dmg

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: squad-*
          path: release
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes "${flags[@]}"
